<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halaman tidak ditemukan · Potensiku</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f7f8fc;--text:#14213d;--muted:#5d6782;--blue:#3157d5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:460px;text-align:center}
.mark{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:26px}
h1{font-size:28px;margin:20px 0 8px}p{color:var(--muted);margin:0 0 24px}
a.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin:4px}
a.ghost{background:transparent;color:var(--blue);border:1.5px solid #c9d3f5}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style></head><body><main>
<span class="mark" aria-hidden="true">P</span>
<h1>Halaman tidak ditemukan</h1>
<p>Alamat yang kamu buka tidak ada atau sudah dipindahkan.</p>
<a class="btn" href="/">Ke beranda Potensiku</a>
<a class="btn ghost" href="/app/">Buka aplikasi</a>
</main></body></html>
